name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Worker and web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Test evidence and export logic
        run: npm test
        working-directory: web
      - name: Build Cloudflare release
        run: npm run build
        working-directory: web

  test:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: test-key-not-used
      MODEL: gpt-4o-mini

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest -q --cov=src --cov-report=term-missing

      - name: Validate report manifest, PDFs and Chroma catalog
        run: python scripts/generate_report_catalog.py --check

      - name: Validate public page search against source PDFs
        run: python scripts/build_report_search.py --check

      - name: Recheck a stored 2026 vector against the configured model
        run: python scripts/verify_chroma_vectors.py --store chroma_store --id ec_forecast_2026_chunk_0

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build application image
        run: docker build -t global-economic-intelligence-agent:ci .
